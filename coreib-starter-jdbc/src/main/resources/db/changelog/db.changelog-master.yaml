databaseChangeLog:
  - changeSet:
      id: coreib-001-platform-metadata
      author: coreib
      labels: baseline
      comment: Platform-owned metadata used to verify migration state.
      changes:
        - createTable:
            tableName: coreib_platform_metadata
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_platform_metadata
              - column:
                  name: platform_version
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - insert:
            tableName: coreib_platform_metadata
            columns:
              - column:
                  name: id
                  value: coreib
              - column:
                  name: platform_version
                  value: 0.1.0-SNAPSHOT
              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            tableName: coreib_platform_metadata

  - changeSet:
      id: coreib-002-security-permission-foundation
      author: coreib
      labels: security
      comment: Portable authorization metadata for roles, management relationships, row scopes and field access.
      changes:
        - createTable:
            tableName: coreib_sec_role
            columns:
              - column:
                  name: role_code
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_role
              - column:
                  name: display_name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(512)
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createTable:
            tableName: coreib_sec_user_role
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_user_role
              - column:
                  name: user_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: role_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createTable:
            tableName: coreib_sec_permission
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_permission
              - column:
                  name: role_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: resource
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: row_scope
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: policy_key
                  type: varchar(128)
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createTable:
            tableName: coreib_sec_field_permission
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_field_permission
              - column:
                  name: role_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: resource
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: field_name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: access_mode
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createTable:
            tableName: coreib_sec_user_supervisor
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_user_supervisor
              - column:
                  name: user_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: supervisor_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: relation_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: datetime
              - column:
                  name: effective_to
                  type: datetime
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createTable:
            tableName: coreib_sec_record_assignment
            columns:
              - column:
                  name: id
                  type: varchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_coreib_sec_record_assignment
              - column:
                  name: resource
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: record_id
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: assignment_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: datetime
              - column:
                  name: effective_to
                  type: datetime
